name: PR Rules Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Download the repo's code onto the runner so the script exists there.
      # Default checkout = the PR's head commit. We switch to the BASE branch
      # in Step 8, so a PR can't change the rules or script that review it.
      - uses: actions/checkout@v4

      # Install Python on the runner.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # anthropic = Claude SDK; requests = GitHub API; pytest = unit tests
      - run: pip install anthropic requests pytest

      - run: pytest .github/tests -q

      - run: python .github/scripts/review.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_MODEL: claude-sonnet-5-5
          DRY_RUN: "1"